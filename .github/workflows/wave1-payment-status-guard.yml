name: wave1-payment-status-guard

on:
  push:
    branches:
      - markabat-v4-phase2-wave1-fix

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[payment-status-guard]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: markabat-v4-phase2-wave1-fix
          fetch-depth: 0
      - name: Add explicit successful-payment escrow guard and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('backend/lib/transfer-workflow.ts')
          s = workflow.read_text()
          old = "if (!payment || payment.vehicleSaleId !== sale.id || payment.userId !== sale.buyerId || !payment.amount.eq(sale.totalPaidYER) || payment.currency !== params.currency) throw new Error('ESCROW_PAYMENT_MISMATCH');"
          new = "if (!payment || payment.status !== 'SUCCESS' || payment.vehicleSaleId !== sale.id || payment.userId !== sale.buyerId || !payment.amount.eq(sale.totalPaidYER) || payment.currency !== params.currency) throw new Error('ESCROW_PAYMENT_MISMATCH');"
          if s.count(old) != 1:
              raise SystemExit('transfer-workflow escrow payment guard target mismatch')
          workflow.write_text(s.replace(old, new))

          test = Path('backend/tests/financial.test.ts')
          t = test.read_text()
          anchor = "      expect(await db.financialLedger.count({ where: { transactionId: sale.id } })).toBe(0);\n\n"
          insert = "      expect(await db.financialLedger.count({ where: { transactionId: sale.id } })).toBe(0);\n\n      await db.paymentTransaction.update({ where: { vehicleSaleId: sale.id }, data: { status: 'FAILED' } });\n      await expect(confirmEscrowHeld({ saleId: sale.id, escrowProviderReference: `ESCROW-FAILED-PAYMENT-${suffix}`, paymentProviderReference: providerReference, amountYER: totalPaidYER, currency: 'YER' })).rejects.toThrow('ESCROW_PAYMENT_MISMATCH');\n      await db.paymentTransaction.update({ where: { vehicleSaleId: sale.id }, data: { status: 'SUCCESS' } });\n\n"
          if t.count(anchor) != 1:
              raise SystemExit('financial test insertion target mismatch')
          test.write_text(t.replace(anchor, insert))
          PY
          git diff --check -- backend/lib/transfer-workflow.ts backend/tests/financial.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/lib/transfer-workflow.ts backend/tests/financial.test.ts
          git commit -m 'fix: require successful payment before escrow confirmation [payment-status-guard]'
          git push origin HEAD:markabat-v4-phase2-wave1-fix
