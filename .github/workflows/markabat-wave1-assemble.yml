name: markabat-wave1-assemble

on:
  push:
    branches:
      - markabat-v4-phase2-wave1-fix

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: markabat-v4-phase2-wave1-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Restore authoritative Wave 1 content and commit
        env:
          PATCH_B64: 