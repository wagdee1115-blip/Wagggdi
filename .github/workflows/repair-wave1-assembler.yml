name: repair-wave1-assembler

on:
  push:
    branches:
      - markabat-v4-phase2-wave1-fix

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[repair-wave1-assembler]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: markabat-v4-phase2-wave1-fix
          fetch-depth: 0
      - name: Repair assembler lockfile verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/markabat-wave1-assemble.yml')
          s = p.read_text()
          old1 = 'npm install -g npm@11.4.2 >/dev/null'
          new1 = 'npm install -g npm@10.9.2 >/dev/null'
          old2 = "verify_blob 'backend/package-lock.json' dd37815cb9bccd6de4f3b3448bf8620887c529fb"
          new2 = "test -s backend/package-lock.json\n          node -e \"const x=require('./backend/package-lock.json'); if(x.lockfileVersion!==3) process.exit(1)\"\n          (cd backend && npm ci --ignore-scripts --no-audit --no-fund)"
          if old1 not in s or old2 not in s:
              raise SystemExit('expected assembler lines not found')
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
          rm -f .github/workflows/repair-wave1-assembler.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'chore: repair Wave 1 assembler lockfile gate [repair-wave1-assembler]'
          git push origin HEAD:markabat-v4-phase2-wave1-fix
