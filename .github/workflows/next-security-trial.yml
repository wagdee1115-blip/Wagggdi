name: Next Security Upgrade Trial

on:
  push:
    branches:
      - markabat-v4-wave1-next-security-trial

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: markabat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d markabat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/markabat_test
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Pin npm
        run: |
          npm install -g npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Install baseline
        run: npm ci --no-audit --no-fund
      - name: Prepare Next 16 async request API compatibility in runner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cookie_touched=[]
          param_touched=[]

          for p in Path('.').rglob('*.ts'):
              if 'node_modules' in p.parts or '.next' in p.parts:
                  continue
              s=p.read_text()
              n=s
              if 'cookies().' in n:
                  n=n.replace('cookies().', '(await cookies()).')
                  cookie_touched.append(str(p))

              if 'app' in p.parts and 'api' in p.parts and p.name == 'route.ts':
                  n2, count = re.subn(
                      r'\{\s*params\s*\}\s*:\s*\{\s*params\s*:\s*\{([^{}]+)\}\s*\}',
                      lambda m: '{ params }: { params: Promise<{'+m.group(1)+'}> }',
                      n,
                  )
                  if count:
                      n2 = re.sub(r'\bparams\.', '(await params).', n2)
                      n = n2
                      param_touched.append(str(p))

              if n != s:
                  p.write_text(n)

          print('ASYNC_COOKIE_PATCHES', *cookie_touched, sep='\n')
          print('ASYNC_PARAM_PATCHES', *param_touched, sep='\n')
          if len(param_touched) < 20:
              raise SystemExit(f'expected broad dynamic-route migration, got {len(param_touched)} files')
          PY
      - name: Apply Next 16 candidate in runner only
        run: npm install --save-exact next@16.3.1 react@19.2.8 react-dom@19.2.8 @types/react@19 @types/react-dom@19 --no-audit --no-fund
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node -e "const a=require('/tmp/audit.json'); console.log('AUDIT_COUNTS',JSON.stringify(a.metadata?.vulnerabilities||{})); for(const [n,v] of Object.entries(a.vulnerabilities||{})) if(['high','critical'].includes(v.severity)) console.log('AUDIT_HIGH',n,v.severity,JSON.stringify(v.fixAvailable)); if((a.metadata?.vulnerabilities?.high||0)>0 || (a.metadata?.vulnerabilities?.critical||0)>0) process.exit(1);"
      - name: Prisma validate and migrate
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Typecheck
        run: npm run typecheck
      - name: Full tests
        run: npm test
      - name: Next 16 production build and CSS gate
        run: |
          npx next build
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('.next/static');
          const files = [];
          function walk(dir) {
            for (const e of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) walk(p);
              else if (e.name.endsWith('.css')) files.push(p);
            }
          }
          if (!fs.existsSync(root)) throw new Error(`CSS_BUILD_GATE_FAILED: missing ${root}`);
          walk(root);
          if (!files.length) throw new Error('CSS_BUILD_GATE_FAILED: no compiled CSS files were emitted by Next.js');
          let bytes = 0, css = '';
          for (const file of files) { bytes += fs.statSync(file).size; css += '\n' + fs.readFileSync(file,'utf8'); }
          if (bytes < 2000) throw new Error(`CSS_BUILD_GATE_FAILED: compiled CSS is unexpectedly small (${bytes} bytes)`);
          const required = ['.min-h-screen','.grid-cols-2','.rounded-3xl','.bg-slate-50','.text-primary-900'];
          const missing = required.filter(x => !css.includes(x));
          if (missing.length) throw new Error(`CSS_BUILD_GATE_FAILED: Tailwind utilities missing: ${missing.join(', ')}`);
          console.log(`CSS_BUILD_GATE_PASS: ${files.length} CSS file(s), ${bytes} bytes, Tailwind utilities verified.`);
          NODE
