name: Export Verified MARKABAT V4 Source Snapshot

on:
  push:
    branches:
      - markabat-v4-wave1-next-security-trial

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact verified source
        uses: actions/checkout@v4
        with:
          ref: f643d5539a4e0a356bb1cff5786ad3d52213386b
          fetch-depth: 1

      - name: Verify and stage exact tracked snapshot
        run: |
          test "$(git rev-parse HEAD)" = "f643d5539a4e0a356bb1cff5786ad3d52213386b"
          mkdir -p /tmp/markabat-export
          git archive HEAD | tar -x -C /tmp/markabat-export
          cat > /tmp/markabat-export/SOURCE-SNAPSHOT-METADATA.txt <<'EOF'
          MARKABAT V4 — VERIFIED SOURCE SNAPSHOT
          Source branch: markabat-v4-phase2-wave1-fix
          Source commit: f643d5539a4e0a356bb1cff5786ad3d52213386b
          Base main commit: e4a89d7ed1fbc15454831861450ae062db0ed7f1
          Export date: 2026-08-14
          App root: backend/
          This archive contains tracked repository files at the verified source commit.
          No .git directory, runtime secrets, node_modules, .next build cache, or production database data are included.
          EOF
          echo "TRACKED_FILES=$(git ls-files | wc -l)"
          du -sh /tmp/markabat-export

      - name: Upload complete source archive
        uses: actions/upload-artifact@v4
        with:
          name: MARKABAT-V4-FULL-SOURCE-f643d553
          path: /tmp/markabat-export/
          include-hidden-files: true
          compression-level: 9
          if-no-files-found: error
          retention-days: 7
