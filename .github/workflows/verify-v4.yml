name: Verify MARKABAT V4

on:
  workflow_dispatch:

  push:
    branches:
      - markabat-v4-verification
    paths:
      - "backend/**"
      - ".github/workflows/verify-v4.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: markabat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d markabat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/markabat_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout V4 verification branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify backend files
        run: |
          set -e

          echo "=== MARKABAT V4 BACKEND ==="

          test -f package.json
          test -f prisma/schema.prisma
          test -f prisma/seed.ts
          test -f vercel.json
          test -f next.config.js

          echo "Backend required files found."

      - name: Install dependencies
        run: |
          set -e

          echo "=== Installing dependencies ==="

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check PostgreSQL
        run: |
          set -e

          echo "=== PostgreSQL ==="

          node -e "
          const net = require('net');
          const socket = net.createConnection({
            host: '127.0.0.1',
            port: 5432
          });

          socket.on('connect', () => {
            console.log('PostgreSQL port is reachable.');
            socket.end();
            process.exit(0);
          });

          socket.on('error', (err) => {
            console.error(err.message);
            process.exit(1);
          });
          "

      - name: Prisma validate
        run: |
          set -e

          echo "=== Prisma validation ==="

          npx prisma validate

      - name: Prisma generate
        run: |
          set -e

          echo "=== Prisma client generation ==="

          npx prisma generate

      - name: Prisma database setup
        run: |
          set -e

          echo "=== Prisma database setup ==="

          npx prisma db push --skip-generate

      - name: TypeScript typecheck
        run: |
          set -e

          echo "=== TypeScript typecheck ==="

          npx tsc --noEmit

      - name: Run unit and integration tests
        run: |
          set -e

          echo "=== Unit and integration tests ==="

          npm test -- --runInBand

      - name: Financial tests
        run: |
          set -e

          echo "=== Financial tests ==="

          npx jest tests/financial.test.ts --runInBand

      - name: Sale concurrency tests
        run: |
          set -e

          echo "=== Sale concurrency tests ==="

          npx jest tests/sale-concurrency.test.ts --runInBand

      - name: Security tests
        run: |
          set -e

          echo "=== Security tests ==="

          npx jest tests/security.test.ts --runInBand

      - name: OTP tests
        run: |
          set -e

          echo "=== OTP tests ==="

          npx jest tests/otp.test.ts --runInBand

      - name: State machine tests
        run: |
          set -e

          echo "=== State machine tests ==="

          npx jest tests/state-machine.test.ts --runInBand

      - name: Core tests
        run: |
          set -e

          echo "=== Core tests ==="

          npx jest tests/core.test.ts --runInBand

      - name: E2E tests
        run: |
          set -e

          echo "=== E2E tests ==="

          npx jest tests/e2e.test.ts --runInBand

      - name: Final verification
        run: |
          set -e

          echo "========================================"
          echo " MARKABAT V4 VERIFICATION COMPLETED "
          echo "========================================"
          echo "Files: PASS"
          echo "Dependencies: PASS"
          echo "PostgreSQL: PASS"
          echo "Prisma validate: PASS"
          echo "Prisma generate: PASS"
          echo "Database setup: PASS"
          echo "TypeScript: PASS"
          echo "Tests: PASS"
          echo "========================================"
