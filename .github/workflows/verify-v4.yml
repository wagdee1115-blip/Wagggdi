name: Verify MARKABAT V4

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/verify-v4.yml"
      - ".github/workflows/production-migrations.yml"
  push:
    branches:
      - markabat-v4-production-hardening
      - markabat-v4-verification
    paths:
      - "backend/**"
      - ".github/workflows/verify-v4.yml"
      - ".github/workflows/production-migrations.yml"

permissions:
  contents: read

concurrency:
  group: verify-markabat-v4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Prisma, tests, security gates, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: markabat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d markabat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/markabat_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout pull request HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required project files
        run: |
          set -euo pipefail
          test -f package.json
          test -f prisma/schema.prisma
          test -f prisma/seed.ts
          test -f vercel.json
          test -f next.config.js
          test -f postcss.config.js
          test -f tailwind.config.js
          echo "Required MARKABAT files found."

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::package-lock.json is missing; using npm install. Commit a generated lockfile when registry access permits."
            npm install --no-audit --no-fund
          fi

      - name: Check PostgreSQL
        run: |
          set -euo pipefail
          node -e "const net=require('net');const s=net.createConnection({host:'127.0.0.1',port:5432});s.on('connect',()=>{console.log('PostgreSQL port is reachable.');s.end();process.exit(0)});s.on('error',e=>{console.error(e.message);process.exit(1)})"

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Require migration history
        run: |
          set -euo pipefail
          test -d prisma/migrations
          test -n "$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d -print -quit)"
          echo "Prisma migration history found."

      - name: Prisma migrate deploy on ephemeral CI database
        run: npx prisma migrate deploy

      - name: Prisma migrate status
        run: npx prisma migrate status

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Run complete test suite
        run: npm test
        env:
          NODE_ENV: test

      - name: Production build and CSS gate
        run: npm run build
        env:
          NODE_ENV: production
          JWT_SECRET: markabat-ci-build-only-secret-rotate-before-production-2026

      - name: Production startup health smoke
        env:
          NODE_ENV: production
          JWT_SECRET: markabat-ci-build-only-secret-rotate-before-production-2026
        run: |
          set -euo pipefail
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/markabat-next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/markabat-health.json; then
              node -e "const fs=require('fs');const body=JSON.parse(fs.readFileSync('/tmp/markabat-health.json','utf8'));if(body.ok!==true||body.database!=='ok')process.exit(1);console.log('Production health endpoint and PostgreSQL connection: PASS');"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/markabat-next-start.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/markabat-next-start.log
          exit 1

      - name: Final verification summary
        run: |
          set -euo pipefail
          echo "========================================"
          echo " MARKABAT V4 VERIFICATION PIPELINE "
          echo "========================================"
          echo "Required files: PASS"
          echo "Dependencies: PASS"
          echo "Ephemeral PostgreSQL: PASS"
          echo "Prisma validate/generate: PASS"
          echo "Migration deploy/status: PASS"
          echo "TypeScript: PASS"
          echo "ESLint: PASS"
          echo "Tests: PASS"
          echo "External-provider E2E: DEFERRED (no dedicated sandbox assertions yet)"
          echo "Next.js + Tailwind CSS build gate: PASS"
          echo "Production startup + /api/health: PASS"
          echo "========================================"
