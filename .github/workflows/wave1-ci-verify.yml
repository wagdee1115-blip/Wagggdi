name: Wave 1 Isolated CI Verification

on:
  push:
    branches:
      - markabat-v4-phase2-wave1-fix

permissions:
  contents: read

concurrency:
  group: markabat-wave1-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: markabat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d markabat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/markabat_test
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Pin npm 10.9.2
        run: |
          npm install -g npm@10.9.2
          test "$(npm --version)" = "10.9.2"

      - name: Install exact lockfile
        run: npm ci --no-audit --no-fund

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Prisma migrate status
        run: npx prisma migrate status

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Complete test suite
        run: npm test

      - name: Financial integrity tests
        run: npx vitest run tests/financial.test.ts

      - name: Auction deposit recovery tests
        run: npx vitest run tests/auction-deposit-recovery.test.ts

      - name: Sale concurrency tests
        run: npx vitest run tests/sale-concurrency.test.ts

      - name: Security tests
        run: npx vitest run tests/security.test.ts

      - name: OTP tests
        run: npx vitest run tests/otp.test.ts

      - name: State machine tests
        run: npx vitest run tests/state-machine.test.ts

      - name: Core tests
        run: npx vitest run tests/core.test.ts

      - name: E2E tests
        run: npx vitest run tests/e2e.test.ts

      - name: Production build
        run: npm run build

      - name: Dependency audit evidence
        run: npm audit --omit=dev --json > /tmp/npm-audit.json || true

      - name: Summary
        run: |
          echo 'Wave 1 isolated CI gates completed.'
          node -e "const fs=require('fs'); const p='/tmp/npm-audit.json'; if(fs.existsSync(p)){const x=JSON.parse(fs.readFileSync(p,'utf8')); console.log('audit vulnerabilities:', JSON.stringify(x.metadata?.vulnerabilities||{}));}"
