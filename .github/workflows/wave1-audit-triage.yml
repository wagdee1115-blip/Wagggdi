name: Wave 1 Dependency Audit Triage

on:
  push:
    branches:
      - markabat-v4-phase2-wave1-fix

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Pin npm 10.9.2
        run: |
          npm install -g npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > /tmp/audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          console.log('AUDIT_COUNTS', JSON.stringify(a.metadata?.vulnerabilities || {}));
          for (const [name,v] of Object.entries(a.vulnerabilities || {})) {
            if (!['high','critical'].includes(v.severity)) continue;
            const via = (v.via || []).map(x => typeof x === 'string' ? x : ({source:x.source,name:x.name,title:x.title,severity:x.severity,range:x.range,url:x.url}));
            console.log('AUDIT_ITEM', JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,nodes:v.nodes,via,fixAvailable:v.fixAvailable}));
          }
          NODE
